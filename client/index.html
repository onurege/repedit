<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business District — build your business in a shared city</title>
    <meta name="description" content="A multiplayer low-poly business tycoon. Run a farm, café, bakery or mini market in a shared city, trade with real players, and grow." />
    <style>
      html, body { margin: 0; height: 100%; background: #bfe4f5; }
      #boot {
        position: fixed; inset: 0; z-index: 200;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px;
        background: linear-gradient(160deg, #8ec9e8 0%, #bfe4f5 55%, #d9efd4 100%);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        transition: opacity 0.5s ease;
      }
      #boot h1 {
        margin: 0; font-size: 34px; letter-spacing: 2px; font-weight: 800; color: #0f172a;
      }
      #boot h1 span { color: #e4572e; }
      #boot .sub { color: #47617a; font-size: 14px; letter-spacing: 0.5px; }
      #boot .bar { width: 190px; height: 6px; border-radius: 4px; background: rgba(255,255,255,0.5); overflow: hidden; }
      #boot .bar > div {
        height: 100%; width: 40%; border-radius: 4px; background: #1d4ed8;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(360%); } }
      #boot.hide { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <h1>BUSINESS <span>DISTRICT</span></h1>
      <div class="bar"><div></div></div>
      <div class="sub">Loading the city…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
